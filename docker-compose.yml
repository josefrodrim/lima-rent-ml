# Conveniencia local. El frontend (Next.js) corre con `npm run dev` en
# `app/` y se despliega en Vercel — no vive acá. Ver Fase E / README.
services:
  api:
    build: .
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models

