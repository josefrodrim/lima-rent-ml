[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lima-rent-ml"
version = "0.1.0"
description = "Taller: predicción de precio de alquiler en Lima Metropolitana, de cero a producción."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "lightgbm>=4.3",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.7",
    "folium>=0.16",
    "plotly>=5.22",
    "joblib>=1.4",
    "mlflow>=2.13",
]

# `shap` NO va en las dependencias de la API/producción a propósito: es pesada
# (numba/llvmlite) y el path de producción usa `pred_contrib` nativo de
# LightGBM (ver `src/lima_rent/explain.py`). Solo el notebook la necesita.
[project.optional-dependencies]
notebook = [
    "shap>=0.45",
    "jupyter>=1.0",
]
dev = [
    "ruff>=0.4",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
