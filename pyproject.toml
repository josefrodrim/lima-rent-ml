[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lima-rent-ml"
version = "0.1.0"
description = "Taller: predicción de precio de alquiler en Lima Metropolitana, de cero a producción."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
# Núcleo = exactamente lo que necesita `api/main.py` en producción. Vercel
# empaqueta la función Python desde `requirements.txt` (`-e .`, sin extras),
# así que todo lo que NO sea indispensable para servir una predicción vive en
# un extra opcional más abajo — cada paquete de más acá es bundle y cold
# start de más en la función serverless.
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "lightgbm>=4.3",
    "joblib>=1.4",
    "fastapi>=0.111",
    "pydantic>=2.7",
]

[project.optional-dependencies]
# Solo para `make train` / `scripts/build_notebooks.py`: split, métricas, tracking.
train = [
    "scikit-learn>=1.4",
    "mlflow>=2.13",
]
# Servidor local de desarrollo (`make serve`). Vercel sirve la función ASGI
# directamente, no necesita uvicorn.
serve-local = [
    "uvicorn[standard]>=0.29",
]
# `shap` NO va en las dependencias de la API/producción a propósito: es pesada
# (numba/llvmlite) y el path de producción usa `pred_contrib` nativo de
# LightGBM (ver `src/lima_rent/explain.py`). Solo el notebook la necesita,
# junto con folium/plotly para las visualizaciones.
notebook = [
    "shap>=0.45",
    "jupyter>=1.0",
    "folium>=0.16",
    "plotly>=5.22",
]
dev = [
    "ruff>=0.4",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "nbformat>=5.10",   # usado por scripts/build_notebooks.py
    "nbclient>=0.10",   # ejecución headless para verificar los notebooks
    "ipykernel>=6.29",
]
# Todo junto, para desarrollo local (make install). NO es lo que se despliega.
all = [
    "lima-rent-ml[train,serve-local,notebook,dev]",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
